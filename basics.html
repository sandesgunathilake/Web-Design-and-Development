<html>
    <head>
        <title>HTML Basics</title>
    </head>
    <body>
        <h1>HTML lists</h1>
        <h3>Ordered lists</h3>

        <ol>
            <li>Van</li>
            <li>Car</li>
            <li>Bus</li>
        </ol>
        <ol type="A" start="3">
            <li>Van</li>
            <li>Car</li>
            <li>Bus</li>  
        </ol>
        <ol type="a">
            <li>Van</li>
            <li>Car</li>
            <li>Bus</li>  
        </ol>
        <ol type="I" start="4">
            <li>Van</li>
            <li>Car</li>
            <li>Bus</li>  
        </ol>
        <ol type="i">
            <li>Van</li>
            <li>Car</li>
            <li>Bus</li>  
        </ol>

        <h3>Unordered Lists</h3>
        <ul type="circle">
            <li>Apple</li>
            <li>Orange</li>
            <li>Grapes</li>
        </ul>
        <ul type="square">
            <li>Apple</li>
            <li>Orange</li>
            <li>Grapes</li>
        </ul>
        <ul type="disc">
            <li>Apple</li>
            <li>Orange</li>
            <li>Grapes</li>
        </ul>
        
    </body>
</html>

<html>
    <head>
        <title> Student Registration Form</title>
    </head>
    <body>
        <script src="labsheet4.js"></script>  
        <h2>Student Registration Form</h2>
        <form>
            <label for="Name"> Student Name: </label>
            <input type="text" id="age" name="age" min="1" max="100"><br>
            <br>
            <label for="age">Age :</label>
            <input type="number" id="age" name="age" min="1" max="100"><br>
            <br>
            <label for="Email-address"> Email: </form>
            <input type="Email" id="Email-address" name="Email" required><br>
            <br>
            <label for="Gender"> Gender: </label>
            <input type="radio" id="Male" name="Gender" value="Male">
            <label for="Male">Male </label>
            <input type="radio" id="Female" name="Gender" value="Female">
            <label for="Female">Female </label><br>
            <br>
            <label for="Course">Course: </label>
            <select name="Course" id="Course">
                <option value="Information Technology">Information Technology</option>
                <option value="Data Science">Data Science</option>
                <option value="Business Management">Business Management</option>
                <option value="Software Engineering">Software Engineering</option>
            </select><br>
            <br>
            <input type="checkbox" id="terms" name="terms" required>
            <label id="terms-label" for="terms">I Accept Terms and Conditions</label><br>
            <br>
            <input type="button" value="Register" onclick="validateForm()">
        </form>
    </body>
</html>
